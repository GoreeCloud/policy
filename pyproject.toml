[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goreecloud-policy"
version = "0.1.0.dev0"
description = "Development foundation for GoreeCloud Policy"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
